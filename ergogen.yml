default-rows: &default-rows
  rows:
    bottom:
    home:
    top:

units:
  gateronX: 15.8
  gateronY: 15.6
  u: 15.8

$default_height: gateronY
$default_width: u

points:
  zones:
    index-reach:
      <<: *default-rows
      rotate: 10
      columns:
        main:
          key:
            stagger: -.2u
            spread: 1.1u
    index:
      <<: *default-rows
      anchor:
        ref: index-reach_main_bottom
        shift: [1u, .5u]
        rotate: 0
      columns:
        main:
          key:
            stagger: -.2u
            spread: 1.1u
    middle:
      <<: *default-rows
      anchor:
        ref: index_main_bottom
        shift: [1u, -.5u]
        rotate: -10
      columns:
        main:
          key:
            stagger: .2u
    ring:
      <<: *default-rows
      anchor:
        ref: middle_main_bottom
        rotate: -5
        shift: [1.1u, -0.2u]
      columns:
        main:
    pinky:
      anchor:
        ref: ring_main_bottom
        shift: [2u, -.4u]
        rotate: 8
      rows:
        home:
        bottom:
      columns:
        main:
          key.shift: [-0.3u, 0]
        outer:
          key.shift: [-0.3u, 0]

    thumb:
      anchor:
        ref: index_main_bottom
        shift: [0u, -1.3u]
      columns:
        one:
        two:
          key.shift: [-2.2u, -0.1u]
          key.rotate: 10
        three:
          key.shift: [-4.3u, -0.4u]
          key.rotate: 20
        four:
          key.shift: [-6.3u, -0.9u]
          key.rotate: 30
        five:
          key.shift: [-8.2u, -1.55u]
          key.rotate: 40
        six:
          key.shift: [-7.1u, .85u]
          key.rotate: 10
        seven:
          key.shift: [-9.2u, .5u]
          key.rotate: 20
        eight:
          key.shift: [-11.2u, 0u]
          key.rotate: 30
        nine:
          key.shift: [-10.3u, 1.9u]
          key.rotate: 10
  # mirror:
  #   ref: pinky-reach_main_home
  #   distance: -350
