meta:
 engine: 4.1.0
units:
 $default_width: 14
 $default_height: 14
 $default_padding: U
points:
 zones:
   matrix:
     columns:
       inner.key:
         splay: -3
       index:
       middle.key:
         stagger: 3
         spread: u + 2
         splay: -5
       ring.key:
         stagger: -1
         spread: u + 1
         splay: -2
       pinky.key:
         stagger: -13
         splay: -7
         spread: u + 0.5
       deicks.key:
     rows:
       a:
       b:
       c:
       d:
   thumbfan:
     anchor:
       ref: matrix_inner_a
       shift: [-(2U)+5, -U-3.3]
     columns:
       a.key:
         splay: 20
         shift: [-3.3, .5]
       b.key:
         splay: -20
         origin: [-U/2, 0]
       c.key:
         splay: -10
         origin: [-U/2, 0]
         shift: [1.9, .2]
       d.key:
         splay: -10
         shift: [4, -1.]
